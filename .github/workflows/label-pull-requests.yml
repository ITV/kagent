name: Label Enhancement Proposals

on:
  pull_request_target:
    types: [opened, edited, synchronize]

jobs:
  label-by-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
